name: Release

# Builds Reevun for iPhone and iPad, opens it in the simulator to check it
# starts, and publishes Reevun.ipa as a GitHub release: unsigned, for
# installing on one's own iPhone with a tool that signs it with one's Apple
# ID (Sideloadly, Xcode). TestFlight and the App Store need the Apple
# Developer account's signing. Runs on every change here and on every change
# to app-core (app-core sends "core-updated").
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [core-updated]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ios-app
      - uses: actions/checkout@v5
        with:
          repository: reevun-software/app-core
          token: ${{ secrets.DESKTOP_CI_TOKEN }}
          path: app-core
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The app's own screens, one self-contained page built into the app.
      - name: Screens
        run: |
          npm --prefix app-core ci
          npm --prefix app-core run build
          cp app-core/dist/index.html ios-app/Resources/screens.html
      - name: Project
        working-directory: ios-app
        run: |
          brew install xcodegen
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: $VERSION/; s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: ${{ github.run_number }}/" project.yml
          xcodegen generate
      - name: Build
        working-directory: ios-app
        run: >
          xcodebuild -project Reevun.xcodeproj -scheme Reevun -configuration Release
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO build
      # Started in the simulator; the screen after a while goes into the log
      # (a small JPEG, base64) to look at.
      - name: Start in the simulator
        working-directory: ios-app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" build/Build/Products/Release-iphonesimulator/Reevun.app
          xcrun simctl launch "$DEVICE" app.reevun.ios
          sleep 25
          xcrun simctl io "$DEVICE" screenshot screen.png
          sips -Z 900 -s format jpeg -s formatOptions 60 screen.png --out screen.jpg >/dev/null
          echo "SCREEN-BEGIN"; base64 -b 1000 -i screen.jpg; echo "SCREEN-END"
      - name: Build for iPhone
        working-directory: ios-app
        run: >
          xcodebuild -project Reevun.xcodeproj -scheme Reevun -configuration Release
          -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      # An .ipa is the app in a Payload folder, zipped. Always Reevun.ipa, so
      # .../releases/latest/download/Reevun.ipa is a permanent download link.
      - name: Publish
        working-directory: ios-app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Reevun.app Payload/
          zip -qr Reevun.ipa Payload
          gh release create "v$VERSION" --title "Reevun $VERSION" --notes "" --latest Reevun.ipa
