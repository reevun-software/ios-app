name: Remove Reevun.ipa

# One-off: takes down the release that published Reevun.ipa (and its tag).
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-ipa.yml]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete release v1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.5 --repo ${{ github.repository }} --cleanup-tag --yes
